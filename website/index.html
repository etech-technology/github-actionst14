<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Actions to Amazon S3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">DEVOPS CLASS DEMO</p>
    <h1>GitHub Actions → Amazon S3</h1>
    <p>
      This page was deployed automatically after a push to the
      <strong>main</strong> branch.
    </p>

    <section class="pipeline">
      <span>Git Push</span>
      <span>→</span>
      <span>GitHub Actions</span>
      <span>→</span>
      <span>AWS OIDC</span>
      <span>→</span>
      <span>Amazon S3</span>
    </section>

    <button id="deploymentButton" type="button">Check deployment</button>
    <p id="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
